name: 'Lint Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Print working directory
        run: pwd

      - name: Run Linter
        run: |
          pwd
          # Run flake8 excluding migrations, virtual environments, and node modules
          flake8 server/djangoapp server/djangoproj --exclude=migrations,djangoenv,env,venv,.venv,frontend,build,node_modules --max-line-length=127 --ignore=E501,W503
          echo "Linted all the python files successfully"

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install JSHint
        run: npm install jshint --global

      - name: Run Linter
        run: |
          find ./server/database -name "*.js" -exec jshint {} +
          echo "Linted all the js files successfully"